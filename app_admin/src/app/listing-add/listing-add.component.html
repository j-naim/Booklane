<header class="page-header">
  <div>
    <h1>New listing</h1>
    <p class="subtitle">Add a listing to the inventory.</p>
  </div>
  <a mat-stroked-button routerLink="/">
    <mat-icon>arrow_back</mat-icon>
    Back to listings
  </a>
</header>

<mat-card appearance="outlined" class="form-card">
  <mat-card-content>
    <form (ngSubmit)="onSubmit()" #addForm="ngForm">
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Code</mat-label>
          <input matInput [(ngModel)]="listing.code" name="code" required class="mono-input" placeholder="e.g. GR004" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input matInput [(ngModel)]="listing.name" name="name" required />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Length</mat-label>
          <input matInput [(ngModel)]="listing.length" name="length" required />
          <mat-hint>e.g. 5 Days / 6 Nights</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Start date</mat-label>
          <input matInput type="date" [(ngModel)]="startDateInput" name="start" required />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Resort</mat-label>
          <input matInput [(ngModel)]="listing.resort" name="resort" required />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Per person</mat-label>
          <span matTextPrefix>$&nbsp;</span>
          <input matInput type="number" [(ngModel)]="listing.perPerson" name="perPerson" required class="mono-input" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Image path</mat-label>
          <input matInput [(ngModel)]="listing.image" name="image" required class="mono-input" />
          <mat-hint>Relative path within /public/images/</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput [(ngModel)]="listing.description" name="description" required rows="4"></textarea>
          <mat-hint>Supports basic HTML.</mat-hint>
        </mat-form-field>
      </div>

      @if (errorMessage) {
        <div class="inline-error">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>
      }

      <div class="form-actions">
        <a mat-button routerLink="/">Cancel</a>
        <button mat-flat-button color="primary" type="submit" [disabled]="addForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Creating...' : 'Create listing' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
