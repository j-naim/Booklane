<h2>Add Listing</h2>

<form (ngSubmit)="onSubmit()">
  <input [(ngModel)]="listing.code" name="code" placeholder="Code" required />
  <input [(ngModel)]="listing.name" name="name" placeholder="Name" required />
  <input [(ngModel)]="listing.length" name="length" placeholder="Length" required />
  <input [(ngModel)]="listing.start" name="start" placeholder="Start (ISO date)" required />
  <input [(ngModel)]="listing.resort" name="resort" placeholder="Resort" required />
  <input [(ngModel)]="listing.perPerson" name="perPerson" placeholder="Per Person" required />
  <input [(ngModel)]="listing.image" name="image" placeholder="Image path" required />
  <textarea [(ngModel)]="listing.description" name="description" placeholder="Description" required></textarea>
  <button type="submit">Save</button>
</form>
