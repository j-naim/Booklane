<mat-toolbar class="app-toolbar">
  <a routerLink="/" class="wordmark">Booklane</a>

  <nav class="nav-links">
    <a mat-button routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">
      Listings
    </a>
    @if (authService.isLoggedIn()) {
      <a mat-button routerLink="/add" routerLinkActive="active-link">
        Add Listing
      </a>
    }
  </nav>

  <span class="spacer"></span>

  <button mat-icon-button (click)="toggleDarkMode()" [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
    <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  @if (authService.isLoggedIn()) {
    <span class="user-greeting">Hi, {{ authService.currentUserName() }}</span>
    <button mat-button (click)="logout()">Logout</button>
  } @else {
    <a mat-button routerLink="/login">Login</a>
  }
</mat-toolbar>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
